[project]
name = "hyperfy-speaker"
version = "0.1.0"
description = "A macOS virtual audio output that streams to a spatial speaker in Hyperfy."
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
dependencies = [
  "livekit==1.2.0",
  "sounddevice==0.5.6",
]

[project.scripts]
hyperfy-speaker = "hyperfy_speaker.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
build = ["pyinstaller==6.22.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/hyperfy_speaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
